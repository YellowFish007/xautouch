name: Build XAutouch (Theos)

on:
  push:
    branches: [main, master]
    # 纯文档改动不触发 macOS 编译，省 runner 排队时间
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']
  workflow_dispatch:

jobs:
  # 门禁 1：与商业 XXTouch 的全量对拍（无需 macOS，先跑）
  audit:
    name: 全量对拍 + 静态自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行 309 项静态自检
        run: python tests/verify.py
      - name: 运行 161 项全量对拍
        run: python tests/audit.py

  # 门禁 2：用现成 theos-action 在 macOS runner 编译三种越狱环境。
  # 三种 scheme 串行跑在同一个 macOS job 里，原因见 step 注释：
  # macOS runner 排队超过约 15 分钟会被平台取消（matrix 三个 job 抢不到 runner 时
  # 会随机丢掉一个，实测连丢两次 rootful），单 job 只占一个 runner，命中率高得多。
  build:
    name: 编译打包 (rootful / rootless / roothide)
    needs: audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Theos 与 iOS SDK
        uses: waruhachi/theos-action@v2.6.6
        with:
          # roothide scheme 仅在 waruhachi/theos 的 main 分支提供；
          # 官方 theos/theos master 会报 "roothide package scheme does not exist"。
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'
          libgcuniversal: 'false'
          altlist: 'false'
          comet: 'false'
          orion: 'false'
          shook: 'false'
          libsandy: 'false'
          remotelog: 'false'

      - name: 编译 tweak + App（三种 scheme 串行）
        run: |
          set -eo pipefail
          export FINALPACKAGE=1
          mkdir -p dist
          # arch 固定写死：rootful/rootless 出 arm64，roothide 出 arm64e
          for pair in rootful:arm64 rootless:arm64 roothide:arm64e; do
            SCHEME="${pair%%:*}"
            ARCHTAG="${pair##*:}"
            echo "===== building $SCHEME ($ARCHTAG) ====="
            if [ "$SCHEME" = "rootful" ]; then
              unset THEOS_PACKAGE_SCHEME || true
            else
              export THEOS_PACKAGE_SCHEME="$SCHEME"
            fi
            make clean
            make package
            # Theos 输出到 ./packages/（老版本是 .theos/packages/），两个都认
            shopt -s nullglob
            cands=(packages/*.deb .theos/packages/*.deb)
            shopt -u nullglob
            if [ ${#cands[@]} -eq 0 ]; then
              echo "!! $SCHEME 未产出 deb"
              exit 1
            fi
            deb=$(ls -t "${cands[@]}" | head -1)
            dst="dist/xautouch-1.0.0-${SCHEME}-iphoneos-${ARCHTAG}.deb"
            cp "$deb" "$dst"
            echo "--> $dst  $(du -h "$dst" | cut -f1)"
          done
          echo "===== dist ====="
          ls -lh dist

      - name: 校验 deb 产物结构
        run: |
          set -e
          for deb in dist/*.deb; do
            echo "==== $deb ===="
            dpkg-deb -I "$deb" | head -30
            echo "-- payload 顶层 --"
            dpkg-deb -c "$deb" | head -12
            echo "-- 文件数 --"
            dpkg-deb -c "$deb" | grep -c '^-' || true
          done
          # 关键文件必须都在
          for deb in dist/*.deb; do
            dpkg-deb -c "$deb" | grep -q 'MobileSubstrate/DynamicLibraries/XAutouch.dylib' \
              || { echo "$deb 缺 tweak dylib"; exit 1; }
            dpkg-deb -c "$deb" | grep -q 'Applications/XXTExplorer.app/XXTExplorer' \
              || { echo "$deb 缺 XXTExplorer"; exit 1; }
            dpkg-deb -c "$deb" | grep -q 'LaunchDaemons/app.xautouch.agent.plist' \
              || { echo "$deb 缺 launchd plist"; exit 1; }
          done

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: xautouch-debs
          path: dist/*.deb
          if-no-files-found: error

  # 汇总产物（手动触发时把三个 deb 打成一个可下载件）
  release:
    name: 汇总构建产物
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 列出全部产物
        run: find artifacts -name '*.deb' -exec ls -lh {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: xautouch-all-schemes
          path: artifacts/**/*.deb
